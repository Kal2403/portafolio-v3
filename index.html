<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cristhian Castillo | Full Stack Developer | KalTechGroup</title>

    <!-- Primary Meta Tags -->
    <meta name="title" content="Cristhian Castillo | Full Stack Developer | KalTechGroup" />
    <meta
      name="description"
      content="Portfolio profesional de Cristhian Castillo (KalTechGroup), Full Stack Developer especializado en React, TypeScript, Node.js y MongoDB. Creando aplicaciones web modernas, escalables y accesibles."
    />
    <meta
      name="keywords"
      content="Cristhian Castillo, KalTechGroup, Kal2403, Full Stack Developer, Desarrollador Web, React, TypeScript, Node.js, Express, MongoDB, Tailwind CSS, Frontend, Backend, Portafolio"
    />
    <meta name="author" content="Cristhian Castillo" />
    <meta name="robots" content="index, follow" />

    <!-- Theme Color for Mobile Browsers -->
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0b1120" media="(prefers-color-scheme: dark)" />

    <!-- Open Graph / Facebook / LinkedIn / WhatsApp -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="KalTechGroup Portfolio" />
    <meta property="og:title" content="Cristhian Castillo | Full Stack Developer" />
    <meta
      property="og:description"
      content="Portfolio profesional de Cristhian Castillo. Creación de aplicaciones web modernas, escalables y accesibles con React, Node.js y MongoDB."
    />
    <meta property="og:image" content="/og-image.svg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Cristhian Castillo - Full Stack Developer Portfolio" />

    <!-- Twitter Cards -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Cristhian Castillo | Full Stack Developer" />
    <meta
      name="twitter:description"
      content="Portfolio profesional de Cristhian Castillo. Creación de aplicaciones web modernas, escalables y accesibles con React, Node.js y MongoDB."
    />
    <meta name="twitter:image" content="/og-image.svg" />

    <!-- Icons & Manifest -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/favicon.svg" />
    <link rel="manifest" href="/site.webmanifest" />

    <!-- Google Fonts Preconnect & Inter Font -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />

    <!-- Early Theme Script to Prevent FOUC -->
    <script>
      (function () {
        try {
          const stored = localStorage.getItem('portfolio-theme');
          const isDark = stored
            ? stored === 'dark'
            : window.matchMedia('(prefers-color-scheme: dark)').matches;
          document.documentElement.dataset.theme = isDark ? 'dark' : 'light';
        } catch (_) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
