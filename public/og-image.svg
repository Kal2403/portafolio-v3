<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1120"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
    <radialGradient id="glow1" cx="80%" cy="20%" r="50%">
      <stop offset="0%" stop-color="#2563eb" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#2563eb" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="20%" cy="80%" r="50%">
      <stop offset="0%" stop-color="#1d4ed8" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#1d4ed8" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#glow1)"/>
  <rect width="1200" height="630" fill="url(#glow2)"/>

  <!-- Inner Card -->
  <rect x="60" y="60" width="1080" height="510" rx="28" fill="#111827" fill-opacity="0.75" stroke="#243044" stroke-width="2"/>

  <!-- Decorative Window Controls -->
  <circle cx="110" cy="110" r="7" fill="#f87171"/>
  <circle cx="132" cy="110" r="7" fill="#fbbf24"/>
  <circle cx="154" cy="110" r="7" fill="#4ade80"/>

  <!-- Brand Badge -->
  <g transform="translate(100, 160)">
    <rect width="180" height="36" rx="18" fill="#2563eb" fill-opacity="0.15" stroke="#3b82f6" stroke-opacity="0.4" stroke-width="1.5"/>
    <text x="90" y="23" text-anchor="middle" fill="#60a5fa" font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="700" letter-spacing="2">PORTFOLIO V3</text>
  </g>

  <!-- Title -->
  <text x="100" y="270" fill="#f8fafc" font-family="Inter, system-ui, sans-serif" font-size="64" font-weight="800" letter-spacing="-1">
    Cristhian Castillo
  </text>

  <!-- Subtitle -->
  <text x="100" y="325" fill="#3b82f6" font-family="Inter, system-ui, sans-serif" font-size="30" font-weight="600">
    Full Stack Developer
  </text>

  <text x="100" y="375" fill="#94a3b8" font-family="Inter, system-ui, sans-serif" font-size="22" font-weight="400">
    Building scalable, accessible and modern digital web applications
  </text>

  <!-- Tech Badges -->
  <g transform="translate(100, 440)">
    <!-- React -->
    <rect x="0" y="0" width="100" height="42" rx="12" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
    <text x="50" y="26" text-anchor="middle" fill="#e2e8f0" font-family="Inter, system-ui, sans-serif" font-size="16" font-weight="600">React</text>

    <!-- TypeScript -->
    <rect x="116" y="0" width="135" height="42" rx="12" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
    <text x="183.5" y="26" text-anchor="middle" fill="#e2e8f0" font-family="Inter, system-ui, sans-serif" font-size="16" font-weight="600">TypeScript</text>

    <!-- Node.js -->
    <rect x="267" y="0" width="115" height="42" rx="12" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
    <text x="324.5" y="26" text-anchor="middle" fill="#e2e8f0" font-family="Inter, system-ui, sans-serif" font-size="16" font-weight="600">Node.js</text>

    <!-- MongoDB -->
    <rect x="398" y="0" width="125" height="42" rx="12" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
    <text x="460.5" y="26" text-anchor="middle" fill="#e2e8f0" font-family="Inter, system-ui, sans-serif" font-size="16" font-weight="600">MongoDB</text>

    <!-- Tailwind CSS -->
    <rect x="539" y="0" width="145" height="42" rx="12" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
    <text x="611.5" y="26" text-anchor="middle" fill="#e2e8f0" font-family="Inter, system-ui, sans-serif" font-size="16" font-weight="600">Tailwind CSS</text>
  </g>

  <!-- Brand Mark Icon on Right -->
  <g transform="translate(930, 205)">
    <rect width="150" height="150" rx="36" fill="url(#primaryGrad)"/>
    <rect x="4" y="4" width="142" height="142" rx="32" stroke="#93c5fd" stroke-width="3" stroke-opacity="0.35"/>
    <path d="M52 40v70" stroke="#ffffff" stroke-width="12" stroke-linecap="round"/>
    <path d="M98 44L61 76" stroke="#ffffff" stroke-width="12" stroke-linecap="round"/>
    <path d="M63 71l36 38" stroke="#93c5fd" stroke-width="12" stroke-linecap="round"/>
    <circle cx="98" cy="44" r="6" fill="#60a5fa"/>
  </g>
</svg>
